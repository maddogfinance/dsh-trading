name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily canary: catches upstream drift (dsh rc bumps, dependency breakage)
    # while nobody is looking. A maintained repo proves it by machine.
    - cron: '20 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
